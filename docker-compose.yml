services:

  db:

    image: mysql:8.0

    restart: unless-stopped

    # 仅用 .env 注入 MYSQL_*，避免宿主机 shell 里 export 过 MYSQL_PASSWORD（含中文）

    # 在解析 compose 时覆盖 ${MYSQL_PASSWORD} 导致 PyMySQL latin-1 报错

    env_file:

      - .env

    volumes:

      - mysql_data:/var/lib/mysql

    command:

      - --character-set-server=utf8mb4

      - --collation-server=utf8mb4_unicode_ci

    healthcheck:

      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]

      interval: 5s

      timeout: 5s

      retries: 30

      start_period: 40s



  redis:

    image: redis:7-alpine

    restart: unless-stopped

    volumes:

      - redis_data:/data



  web:

    build: .

    restart: unless-stopped

    env_file:

      - .env

    environment:

      DJANGO_SETTINGS_MODULE: auto_amazon_project.settings

      DB_HOST: db

      DB_PORT: "3306"

      REDIS_HOST: redis

      REDIS_PORT: "6379"

      REDIS_DB: "1"

      REDIS_PASSWORD: ""

      ROI_USE_RQ: "true"

      ROI_ASIN_MAX_RETRIES: "3"

      ROI_ASIN_RETRY_DELAY_SEC: "5"

      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}

    volumes:

      - static_data:/app/staticfiles

      - media_data:/app/media


      - ./scripts/asin_find_project/config_file:/app/scripts/asin_find_project/config_file

    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_started



  worker-single:

    build: .

    restart: unless-stopped

    env_file:

      - .env

    environment:

      DJANGO_SETTINGS_MODULE: auto_amazon_project.settings

      DB_HOST: db

      DB_PORT: "3306"

      REDIS_HOST: redis

      REDIS_PORT: "6379"

      REDIS_DB: "1"

      REDIS_PASSWORD: ""

      SELLER_CREDENTIAL_PROFILE: "single"

      ROI_WIZARD_EXEC_MODE: "inprocess"

      ROI_ASIN_MAX_RETRIES: "3"

      ROI_ASIN_RETRY_DELAY_SEC: "5"

      ROI_SELLERSPRITE_MAX_CONCURRENT: "6"

      ROI_SIF_MAX_CONCURRENT: "4"

      ROI_TAOBAO_MAX_CONCURRENT: "1"

      RQ_JOB_TIMEOUT: "86400"

    volumes:

      - media_data:/app/media


      - ./scripts/asin_find_project/config_file:/app/scripts/asin_find_project/config_file

    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_started

    command: python manage.py run_roi_worker --name roi-worker-single --queues roi_single



  worker-bulk:

    build: .

    restart: unless-stopped

    env_file:

      - .env

    environment:

      DJANGO_SETTINGS_MODULE: auto_amazon_project.settings

      DB_HOST: db

      DB_PORT: "3306"

      REDIS_HOST: redis

      REDIS_PORT: "6379"

      REDIS_DB: "1"

      REDIS_PASSWORD: ""

      SELLER_CREDENTIAL_PROFILE: "bulk"

      ROI_WIZARD_EXEC_MODE: "inprocess"

      ROI_ASIN_MAX_RETRIES: "3"

      ROI_ASIN_RETRY_DELAY_SEC: "5"

      ROI_SELLERSPRITE_MAX_CONCURRENT: "6"

      ROI_SIF_MAX_CONCURRENT: "4"

      ROI_TAOBAO_MAX_CONCURRENT: "1"

      ROI_SCHEDULER_ASIN_MAX_CONCURRENT: "4"

      RQ_JOB_TIMEOUT: "86400"

    volumes:

      - media_data:/app/media


      - ./scripts/asin_find_project/config_file:/app/scripts/asin_find_project/config_file

    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_started

    command: python manage.py run_roi_worker --name roi-worker-bulk --queues roi_bulk,roi_scheduled



  scheduler:

    build: .

    restart: unless-stopped

    env_file:

      - .env

    environment:

      DJANGO_SETTINGS_MODULE: auto_amazon_project.settings

      DB_HOST: db

      DB_PORT: "3306"

      REDIS_HOST: redis

      REDIS_PORT: "6379"

      REDIS_DB: "1"

      REDIS_PASSWORD: ""

      SCHEDULER_ENABLED: "true"

      PRIORITY_ROI_INTERVAL_DAYS: "7"

      PRIORITY_AD_INTERVAL_DAYS: "7"

      SCHEDULER_BATCH_MODE: "true"

      SCHEDULER_BATCH_HOUR: "23"

      SCHEDULER_BATCH_WINDOW_HOURS: "2"

      ROI_USE_RQ: "true"

      ROI_ASIN_MAX_RETRIES: "3"

      ROI_ASIN_RETRY_DELAY_SEC: "5"

    volumes:

      - media_data:/app/media


      - ./scripts/asin_find_project/config_file:/app/scripts/asin_find_project/config_file

    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_started

      worker-single:

        condition: service_started

      worker-bulk:

        condition: service_started

    command: >

      sh -c "while true; do

        python manage.py run_scheduled_asin_jobs;

        sleep 3600;

      done"



  nginx:

    image: nginx:1.27-alpine

    restart: unless-stopped

    ports:

      - "${HTTP_PORT:-8080}:80"

    volumes:

      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      - static_data:/static:ro

      - media_data:/media:ro

    depends_on:

      - web



volumes:

  mysql_data:

  redis_data:

  static_data:

  media_data:


